server:
  port: 8083

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/kyc_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

    # HikariCP connection pool settings
    hikari:
      pool-name: KycHikariPool
      minimum-idle: 2
      maximum-pool-size: 10
      idle-timeout: 30000                   # 30 seconds
      connection-timeout: 20000             # 20 seconds
      max-lifetime: 1800000                 # 30 minutes

  jpa:
    hibernate:
      ddl-auto: update                      # auto-creates/updates tables on startup
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
        jdbc:
          time_zone: UTC

logging:
  level:
    com.cognizant.digitalwalletsystem: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE  # shows bind parameter values
    com.zaxxer.hikari: INFO

 #Eureka registration config
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    health-check-url-path: /actuator/health

# OpenFeign Client Configuration - Development (local)
app:
  notification-service:
    # Local dev: Notification Service runs on 8085
    # This URL will be used in @FeignClient if the url attribute is specified
    # For Eureka service discovery, this can be removed after migration
    base-url: http://localhost:8085

  # Root directory for uploaded KYC documents. Each user's files live under
  # <upload.dir>/user_<userId>/. Path can be absolute (e.g. C:/dws/uploads/kyc)
  # or relative to the service's working directory.
  upload:
    dir: ./uploads/kyc