server:
  port: 8085

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/transaction_service_db_dev?createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health, info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: warn
    com.cognizant.TransactionService: info          # application-level — info and above
    com.cognizant.TransactionService.service: debug  # service layer — verbose for dev
    org.springframework.web: warn
    org.hibernate.SQL: warn                          # set to DEBUG to see all SQL (show-sql above handles formatting)
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-}] %logger{36} - %msg%n"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/